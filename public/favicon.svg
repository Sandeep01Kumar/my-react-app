<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="John Doe portfolio logo">
  <title>John Doe — Software QA Engineer &amp; React Developer</title>
  <!-- Corporate brand mark: royal-blue #2563EB to navy #0A1A3F rounded
       square with white "JD" initials, mirroring the in-app Logo component
       and the theme-color meta tag. -->
  <defs>
    <linearGradient id="jd-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#0A1A3F" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#jd-bg)" />
  <text x="24" y="25" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-1" fill="#FFFFFF">JD</text>
</svg>
